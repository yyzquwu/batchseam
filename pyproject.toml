[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batchseam"
version = "0.3.0"
description = "Check whether a Polars transformation changes when its input is split into batches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["polars>=2.1,<3"]

[project.scripts]
batchseam = "batchseam.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
